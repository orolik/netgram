services:
  netgram:
    build: .
    container_name: netgram
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NETGRAM_DATA_DIR=/data
      - HTTPS_PROXY=socks5://host.docker.internal:18200
      - HTTP_PROXY=socks5://host.docker.internal:18200
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./data:/data
    restart: unless-stopped